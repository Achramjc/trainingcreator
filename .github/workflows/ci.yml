name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Install package (sanity check)
        run: pip install -e .

      - name: Run tests
        run: python -m pytest tests/ -q

  # The browser half of the SCORM conformance harness: a package's pages are
  # driven inside a fake LMS in headless Chromium.  These tests skip cleanly
  # when no browser is installed, which is why the `test` job above stays
  # green without one - this job is where they actually run.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest playwright

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run the SCORM conformance harness
        run: python -m pytest tests/conformance tests/test_scorm.py -q
